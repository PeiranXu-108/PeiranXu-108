name: Update README stats

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-readme-stats.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download stats cards
        run: |
          mkdir -p profile
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 30 \
            "https://github-stats-extended.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true" \
            --output profile/stats.svg
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 30 \
            "https://github-stats-extended.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact" \
            --output profile/top-langs.svg

      - name: Validate generated cards
        run: |
          for card in profile/stats.svg profile/top-langs.svg; do
            test -s "$card"
            grep -q '<svg' "$card"
            if grep -qiE 'Something went wrong|Maximum retries exceeded|rate limit' "$card"; then
              echo "Generated an error card: $card" >&2
              exit 1
            fi
          done

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update README stats cards"
          git push
